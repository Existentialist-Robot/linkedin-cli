# .repo-relation.yaml: a machine-readable statement of where this repository sits among the
# repositories it is maintained beside. The graph is keyed by repository NAME; nothing here is a path.
repo: linkedin-cli
plane: tooling                     # a command-line tool other projects call; a public repository
                                   # holds no private context, so it stands on its own
canonical_home: origin             # the hosted repository is the canonical copy
writers: single

context:
  upstream: ~                      # downstream of nothing
  receives: []
  emits_upstream: false
  readable_by_root: true

tooling:
  source: ~                        # it is a source, not a consumer
  mode: ~
  vendored_upstream_sha: ~

startup:
  tier0: [.repo-relation.yaml]
  tier1: README.md
  tier2_on_demand: [llms.txt]
