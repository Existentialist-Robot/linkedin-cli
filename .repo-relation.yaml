# .repo-relation.yaml: a machine-readable statement of where this repository sits among the
# repositories it is maintained beside. The graph is keyed by repository NAME; nothing here is a path.
repo: linkedin-cli
plane: tooling                     # a command-line tool other projects call; a public repository
                                   # holds no private context, so it stands on its own
canonical_home: origin             # the hosted repository is the canonical copy
writers: single

context:
  upstream: ~                      # downstream of nothing
  receives: []
  emits_upstream: false
  readable_by_root: true

tooling:
  source: ~                        # it is a source, not a consumer
  mode: ~
  vendored_upstream_sha: ~

startup:
  tier0: [.repo-relation.yaml]
  tier1: AGENTS.md
  tier2_on_demand: [README.md, llms.txt]

# Architecture record (an inactive, declarative profile; nothing here is enforced or run).
architecture:
  # R6, assessment rank 1: one revision-pinned surface -> role/mechanism crosswalk row.
  # `blob` is the surface's git blob at `revision`, so a later edit to it reads as drift.
  crosswalk:
    - surface: README.md
      role: routing-layout
      mechanism: README.md is the orientation page for the verbs and the bound-session model; llms.txt
        is its agent-facing summary
      revision: 9ad649e81ae1a0230f46111f1765a7bef7f26d6e
      blob: 6258c7ff5b90eb2c83d71baa768e9cf1e31cefd0
